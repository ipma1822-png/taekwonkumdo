<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WTKF 회원관리 | 관리자</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#080d16;color:#eef3fb}.wrap{width:min(1280px,calc(100% - 28px));margin:28px auto 70px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:28px}.muted{color:#94a0b3}.panel{border:1px solid #263245;background:#0e1624;border-radius:18px;padding:18px;margin-bottom:16px}.login{max-width:520px;margin:70px auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #263245;border-radius:14px;padding:14px;background:#111c2c}.stat b{display:block;font-size:25px}.controls{display:grid;grid-template-columns:1.3fr .7fr .7fr auto;gap:10px}.controls input,.controls select,.login input,.modal input,.modal select{width:100%;border:1px solid #334157;background:#09111d;color:#fff;border-radius:10px;padding:11px;font:inherit}.btn{border:1px solid #394a64;background:#142238;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.gold{background:#b08b36;border-color:#b08b36;color:#07101b}.btn.red{border-color:#8b4242}.table-wrap{overflow:auto;border:1px solid #263245;border-radius:16px}table{border-collapse:collapse;width:100%;min-width:1150px}th,td{padding:11px 10px;border-bottom:1px solid #202c3d;text-align:left;font-size:13px}th{position:sticky;top:0;background:#111a28;color:#b9c3d2}.status{display:inline-flex;padding:4px 8px;border-radius:999px;background:#202c3d}.photo{width:44px;height:54px;object-fit:cover;border-radius:7px;background:#1b2738}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-bg.open{display:flex}.modal{width:min(820px,100%);max-height:90vh;overflow:auto;background:#0e1624;border:1px solid #34435a;border-radius:18px;padding:20px}.detail{display:grid;grid-template-columns:160px 1fr;gap:18px}.detail img{width:160px;max-height:210px;object-fit:cover;border-radius:12px;background:#172438}.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ditem{padding:10px;border:1px solid #263245;border-radius:10px}.ditem span{display:block;color:#8f9db0;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.detail img{width:120px}.dgrid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<section id="loginView" class="panel login"><h1>WTKF 회원관리</h1><p class="muted">관리자 계정으로 로그인해 주세요.</p><p><input id="email" type="email" placeholder="관리자 이메일"></p><p><input id="password" type="password" placeholder="비밀번호"></p><button id="loginBtn" class="btn gold">로그인</button><p id="loginMsg" class="muted"></p></section>
<div id="appView" hidden>
<div class="top"><div><h1>태권검도 회원가입 관리</h1><div class="muted">신청 확인 · 승인 · 대원번호 발급</div></div><div><button id="reloadBtn" class="btn">새로고침</button> <button id="logoutBtn" class="btn">로그아웃</button></div></div>
<section class="grid panel"><div class="stat"><span class="muted">전체</span><b id="sAll">0</b></div><div class="stat"><span class="muted">심사중</span><b id="sPending">0</b></div><div class="stat"><span class="muted">승인</span><b id="sApproved">0</b></div><div class="stat"><span class="muted">보류·반려</span><b id="sEtc">0</b></div></section>
<section class="panel controls"><input id="q" placeholder="이름·연락처·이메일·소속 검색"><select id="statusFilter"><option value="">전체 상태</option><option value="pending">심사중</option><option value="approved">승인</option><option value="hold">보류</option><option value="rejected">반려</option></select><select id="typeFilter"><option value="">전체 가입구분</option><option>일반회원</option><option>수련생</option><option>지도자</option><option>도장관장</option><option>지부회원</option><option>기타</option></select><button id="csvBtn" class="btn">CSV</button></section>
<div class="table-wrap"><table><thead><tr><th>사진</th><th>신청일</th><th>이름</th><th>지역</th><th>가입구분</th><th>소속</th><th>연락처</th><th>상태</th><th>회원번호</th><th>관리</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div></div>
<div id="modalBg" class="modal-bg"><div class="modal"><div style="display:flex;justify-content:space-between;gap:10px"><h2 style="margin-top:0">회원 신청 상세</h2><button id="closeModal" class="btn">닫기</button></div><div id="detail"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ojxarsfaewehwjidwgac.supabase.co';
const SUPABASE_KEY='sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let rows=[],current=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const labels={pending:'심사중',approved:'승인',hold:'보류',rejected:'반려'};
async function sessionInit(){const {data}=await db.auth.getSession(); if(data.session){$('loginView').hidden=true;$('appView').hidden=false;await load()} }
$('loginBtn').onclick=async()=>{ $('loginMsg').textContent='로그인 중...'; const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}); if(error){$('loginMsg').textContent='로그인 실패: '+error.message;return}$('loginView').hidden=true;$('appView').hidden=false;await load() };
$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};$('reloadBtn').onclick=load;
async function load(){const {data,error}=await db.from('wtkf_member_applications').select('*').order('created_at',{ascending:false});if(error){alert('목록을 불러오지 못했습니다: '+error.message);return}rows=data||[];await hydratePhotos(rows);render()}
async function hydratePhotos(list){for(const r of list){r._photo='';if(r.photo_url){const {data}=await db.storage.from('wtkf-member-photos').createSignedUrl(r.photo_url,3600);r._photo=data?.signedUrl||''}}}
function render(){const q=$('q').value.trim().toLowerCase(),sf=$('statusFilter').value,tf=$('typeFilter').value;const f=rows.filter(r=>(!sf||r.status===sf)&&(!tf||r.member_type===tf)&&(!q||[r.name,r.phone,r.email,r.organization].some(x=>String(x||'').toLowerCase().includes(q))));$('sAll').textContent=rows.length;$('sPending').textContent=rows.filter(r=>r.status==='pending').length;$('sApproved').textContent=rows.filter(r=>r.status==='approved').length;$('sEtc').textContent=rows.filter(r=>r.status==='hold'||r.status==='rejected').length;$('tbody').innerHTML=f.map(r=>`<tr><td>${r._photo?`<img class="photo" src="${esc(r._photo)}">`:'-'}</td><td>${new Date(r.created_at).toLocaleDateString('ko-KR')}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.region)}</td><td>${esc(r.member_type)}</td><td>${esc(r.organization||'-')}</td><td>${esc(r.phone)}</td><td><span class="status">${labels[r.status]||esc(r.status||'')}</span></td><td>${esc(r.member_number||'-')}</td><td><button class="btn" onclick="openRow(${Number(r.id)})">상세</button></td></tr>`).join('')||'<tr><td colspan="10">신청자가 없습니다.</td></tr>'}
$('q').oninput=render;$('statusFilter').onchange=render;$('typeFilter').onchange=render;
window.openRow=id=>{current=rows.find(r=>Number(r.id)===Number(id));if(!current)return;const r=current;$('detail').innerHTML=`<div class="detail"><div>${r._photo?`<img src="${esc(r._photo)}">`:'<div class="ditem">사진 없음</div>'}</div><div><div class="dgrid"><div class="ditem"><span>이름</span>${esc(r.name)}</div><div class="ditem"><span>나이</span>${esc(r.age)}</div><div class="ditem"><span>지역</span>${esc(r.region)}</div><div class="ditem"><span>연락처</span>${esc(r.phone)}</div><div class="ditem"><span>이메일</span>${esc(r.email)}</div><div class="ditem"><span>가입구분</span>${esc(r.member_type)}</div><div class="ditem"><span>소속</span>${esc(r.organization||'-')}</div><div class="ditem"><span>태권도 단·품</span>${esc(r.taekwondo_rank||'-')}</div><div class="ditem"><span>태권검도 수련</span>${esc(r.wtkf_experience||'-')}</div><div class="ditem"><span>가입경로</span>${esc(r.join_source||'-')}</div><div class="ditem"><span>추천인</span>${esc(r.referrer||'-')}</div><div class="ditem"><span>회원번호</span>${esc(r.member_number||'-')}</div></div><div class="ditem" style="margin-top:9px"><span>검도·검술 관련 경력</span>${esc(r.sword_experience||'-')}</div><div class="actions"><button class="btn gold" onclick="setState('approved')">승인</button><button class="btn" onclick="setState('pending')">심사중</button><button class="btn" onclick="setState('hold')">보류</button><button class="btn red" onclick="setState('rejected')">반려</button></div></div></div>`;$('modalBg').classList.add('open')}
window.setState=async state=>{if(!current)return;const patch={status:state};if(state==='approved'&&!current.member_number){patch.member_number=`WTKF-${new Date().getFullYear()}-${String(current.id).padStart(5,'0')}`};const {error}=await db.from('wtkf_member_applications').update(patch).eq('id',current.id);if(error){alert('저장 실패: '+error.message);return}$('modalBg').classList.remove('open');await load()};
$('closeModal').onclick=()=> $('modalBg').classList.remove('open');$('modalBg').onclick=e=>{if(e.target===$('modalBg'))$('modalBg').classList.remove('open')};
$('csvBtn').onclick=()=>{const cols=['id','created_at','name','age','region','phone','email','organization','taekwondo_rank','sword_experience','wtkf_experience','member_type','join_source','referrer','status','member_number'];const csv=[cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='WTKF-members-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)};
sessionInit();
</script></body></html>
