<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 확인 중 | WTKF</title>
<style>
:root{--bg:#071426;--panel:#0d1d33;--gold:#d7b35a;--text:#eef4ff;--muted:#aebcd1;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans KR",sans-serif}.c{width:min(620px,calc(100% - 30px));background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.22)}h1{color:var(--gold);margin:0 0 12px}p{color:var(--muted);line-height:1.65}.spin{width:42px;height:42px;margin:20px auto;border:4px solid rgba(255,255,255,.15);border-top-color:var(--gold);border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}a{color:var(--gold);font-weight:800}
</style>
</head>
<body>
<div class="c"><h1>WTKF 로그인 확인 중</h1><div class="spin"></div><p id="msg">이메일 인증을 확인하고 태권검도 학습관으로 돌아갑니다.</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0');
const q=new URLSearchParams(location.search);
const r=q.get('return');
const target=(r&&r.startsWith('/')&&!r.startsWith('//'))?r:'/taekwonkumdo/media/#wtkf-learning';
const targetUrl=new URL(target,location.origin).href;
const msg=document.getElementById('msg');
async function finish(){
  for(let i=0;i<20;i++){
    const {data}=await db.auth.getSession();
    if(data.session){ location.replace(targetUrl); return; }
    await new Promise(res=>setTimeout(res,250));
  }
  msg.innerHTML='로그인 정보를 확인하지 못했습니다. <a href="../member-login/">통합회원 로그인으로 돌아가기</a>';
}
db.auth.onAuthStateChange((event,session)=>{ if(session) location.replace(targetUrl); });
finish();
</script>
</body>
</html>
